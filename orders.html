<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Текущие заказы — SunProtection</title>
  <meta name="theme-color" content="#f5f4f1">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" href="icons/favicon-64.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <style>
    :root { --bg: #f5f4f1; --card: #ffffff; --ink: #16181d; --ink2: #3f434b; --muted: #6b7079; --sep: rgba(22,24,29,0.08); --fill: #f3f2ef; --line: rgba(22,24,29,0.08);
      --accent: #ea580c; --accent-2: #f97316; --accent-ink: #c2410c; --soft: #fff1e8; --blue: #0b72e7; --blue-soft: #e8f3ff; --red: #dc2626; --green: #15803d; --green-soft: #ecfdf3; --slate: #334155; --slate-soft: #eef1f5;
      --shadow: 0 1px 2px rgba(16,24,40,0.04), 0 6px 20px rgba(16,24,40,0.05); }
    * { box-sizing: border-box; }
    html, body { margin: 0; }
    body { font-family: "Manrope", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-feature-settings: "tnum" 1; -webkit-font-smoothing: antialiased;
      background: var(--bg); color: var(--ink); padding: calc(14px + env(safe-area-inset-top)) 16px calc(24px + env(safe-area-inset-bottom)); -webkit-tap-highlight-color: transparent; }
    .wrap { max-width: 1180px; margin: 0 auto; }
    .top { display: flex; align-items: center; gap: 10px; margin-bottom: 16px; min-height: 48px; }
    .icon-btn { flex: none; width: 44px; height: 44px; border-radius: 14px; border: 0; background: var(--card); color: var(--ink2); display: flex; align-items: center; justify-content: center; cursor: pointer; text-decoration: none; padding: 0; box-shadow: var(--shadow); transition: transform .15s; }
    .icon-btn:active { transform: scale(0.94); }
    .icon-btn.spin svg { animation: spin 0.9s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    h1 { flex: 1; min-width: 0; margin: 0; font-size: 22px; font-weight: 800; letter-spacing: -0.02em; line-height: 1.15; }
    h1 small { display: block; font-size: 13px; font-weight: 600; color: var(--muted); margin-top: 2px; letter-spacing: 0; }
    .seg { display: flex; gap: 4px; background: rgba(22,24,29,0.06); padding: 4px; border-radius: 14px; margin-bottom: 10px; }
    .seg button { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; border: none; background: transparent; border-radius: 11px; padding: 10px 4px; font: inherit; font-size: 14px; font-weight: 700; color: var(--muted); cursor: pointer; white-space: nowrap; }
    .seg button.on { background: #fff; color: var(--ink); box-shadow: 0 1px 4px rgba(16,24,40,0.10); }
    .search { width: 100%; padding: 13px 14px; font: inherit; font-size: 16px; font-weight: 600; color: var(--ink); border: 0; border-radius: 14px; background: #fff; margin-bottom: 14px; box-shadow: var(--shadow); }
    .search::placeholder { color: #c3c6cc; font-weight: 500; }
    .search:focus { outline: none; box-shadow: 0 0 0 2px var(--accent); }
    .msg { background: #fff7e6; color: #b45309; border-radius: 14px; padding: 12px 14px; margin-bottom: 12px; font-size: 13px; font-weight: 600; line-height: 1.45; }
    .msg.err { background: #fef2f2; color: var(--red); }
    .msg:empty { display: none; }
    .board { display: grid; grid-template-columns: 1fr; gap: 16px; }
    @media (min-width: 900px) { .board { grid-template-columns: repeat(3, 1fr); align-items: start; } }
    .col { background: transparent; border-radius: 18px; padding: 0; }
    .col-head { display: flex; align-items: center; gap: 8px; padding: 4px 4px 10px; cursor: pointer; user-select: none; }
    .col-dot { width: 8px; height: 8px; border-radius: 50%; flex: none; }
    .col-name { font-size: 12px; font-weight: 800; flex: 1; min-width: 0; text-transform: uppercase; letter-spacing: 0.08em; color: var(--ink2); }
    .col-meta { font-size: 12px; font-weight: 700; color: var(--muted); white-space: nowrap; }
    .col-chev { color: #b4b8bf; transition: transform 0.2s; flex: none; }
    .col.closed .col-chev { transform: rotate(-90deg); }
    .col.closed .cards { display: none; }
    .empty { font-size: 13px; font-weight: 600; color: var(--muted); padding: 14px; background: var(--card); border-radius: 18px; box-shadow: var(--shadow); }
    .card { background: var(--card); border-radius: 18px; padding: 14px 15px; margin-bottom: 10px; box-shadow: var(--shadow); }
    .card:last-child { margin-bottom: 0; }
    .c-top { display: flex; justify-content: space-between; gap: 10px; align-items: baseline; }
    .c-title { font-size: 16px; font-weight: 800; line-height: 1.3; min-width: 0; letter-spacing: -0.01em; }
    .c-price { font-size: 16px; font-weight: 800; color: var(--ink); white-space: nowrap; }
    .c-pipe { font-size: 11px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 4px; }
    .c-row { display: flex; gap: 8px; font-size: 14px; font-weight: 500; margin-top: 7px; line-height: 1.4; align-items: flex-start; color: var(--ink2); }
    .c-row svg { flex: none; margin-top: 1px; color: #a3a8b0; }
    .c-row a { color: var(--blue); text-decoration: none; font-weight: 700; }
    .c-items { margin: 10px 0 0; padding: 9px 11px; background: var(--fill); border-radius: 12px; font-size: 13px; font-weight: 500; line-height: 1.55; }
    .c-items div { display: flex; gap: 6px; }
    .c-items b { color: var(--muted); font-weight: 700; min-width: 18px; }
    .tags { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 10px; }
    .tags.mos .tag { background: var(--blue-soft); color: var(--blue); }
    .tag { font-size: 12px; font-weight: 700; padding: 4px 9px; border-radius: 8px; background: var(--soft); color: var(--accent-ink); }
    .c-age { font-size: 12px; font-weight: 600; color: var(--muted); margin-top: 9px; }
    .c-age.old { color: var(--red); font-weight: 700; }
    .c-pay { font-size: 13px; font-weight: 600; margin-top: 7px; color: var(--ink2); }
    .c-pay b { color: var(--green); white-space: nowrap; }
    .c-actions { display: flex; gap: 8px; margin-top: 12px; }
    .c-actions button, .c-actions a { flex: 1; min-height: 42px; border-radius: 12px; font: inherit; font-size: 14px; font-weight: 700; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px; text-decoration: none; text-align: center; line-height: 1.2; min-height: 44px; }
    .btn-more { border: 0; background: var(--fill); color: var(--ink); box-shadow: inset 0 0 0 1px var(--sep); }
    .btn-amo { border: 0; background: var(--blue-soft); color: var(--blue); }
    .btn-edit { border: 0; background: var(--soft); color: var(--accent-ink); }
    .btn-edit:disabled { opacity: 0.6; }
    .btn-stage { width: 100%; margin-top: 12px; display: flex; align-items: center; gap: 10px; border: 0; border-radius: 14px; background: var(--fill); box-shadow: inset 0 0 0 1px var(--sep); padding: 0 14px; min-height: 46px; font: inherit; font-size: 15px; font-weight: 700; color: var(--ink); cursor: pointer; text-align: left; }
    .btn-stage .dot { width: 9px; height: 9px; border-radius: 50%; flex: none; }
    .btn-stage .lbl { color: var(--muted); font-weight: 600; font-size: 13px; }
    .btn-stage .cur { flex: 1; min-width: 0; }
    .btn-stage svg { flex: none; color: var(--muted); }
    .btn-stage:disabled { opacity: 0.6; }
    .btn-docs { border: 0; background: var(--slate-soft); color: var(--slate); }
    .c-actions .btn-icon { flex: none; width: 44px; padding: 0; }
    .c-age { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .lnk.btn-more { background: none; box-shadow: none; }
    .lnk { border: 0; background: none; color: var(--blue); font: inherit; font-size: 13px; font-weight: 700; cursor: pointer; padding: 6px 0; }
    /* нижняя шторка (этапы, документы) */
    .veil { position: fixed; inset: 0; z-index: 60; background: rgba(16,18,22,0.32); opacity: 0; pointer-events: none; transition: opacity .2s; }
    .veil.show { opacity: 1; pointer-events: auto; }
    .bs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 61; max-width: 560px; margin: 0 auto; background: var(--bg); border-radius: 26px 26px 0 0; max-height: 86vh; overflow-y: auto;
      padding: 10px 16px calc(16px + env(safe-area-inset-bottom)); transform: translateY(105%); visibility: hidden; transition: transform .3s cubic-bezier(.2,.8,.2,1), visibility 0s .3s; }
    .bs.show { transform: none; visibility: visible; transition: transform .3s cubic-bezier(.2,.8,.2,1); }
    .bs .grab { width: 38px; height: 5px; border-radius: 3px; background: #d5d3ce; margin: 0 auto 12px; }
    .bs h2 { margin: 0 4px 2px; font-size: 20px; font-weight: 800; letter-spacing: -0.02em; }
    .bs .bs-sub { margin: 0 4px 14px; font-size: 13px; font-weight: 600; color: var(--muted); }
    .bs .grp { background: var(--card); border-radius: 18px; overflow: hidden; box-shadow: var(--shadow); margin-bottom: 12px; }
    .opt { width: 100%; display: flex; align-items: center; gap: 12px; border: 0; background: none; text-align: left; padding: 12px 14px; min-height: 58px; font: inherit; color: var(--ink); cursor: pointer; position: relative; }
    .opt + .opt::before { content: ""; position: absolute; top: 0; left: 62px; right: 0; height: 1px; background: var(--sep); }
    .opt:active { background: var(--fill); }
    .opt:disabled { opacity: 0.5; }
    .opt .tile { flex: none; width: 36px; height: 36px; border-radius: 12px; display: flex; align-items: center; justify-content: center; }
    .opt .o-b { flex: 1; min-width: 0; }
    .opt .o-t { display: block; font-size: 16px; font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .opt .o-s { display: block; font-size: 13px; font-weight: 500; color: var(--muted); margin-top: 1px; }
    .opt .ck { flex: none; color: var(--accent); }
    .opt.won .o-t { color: var(--green); }
    .bs .cancel { width: 100%; border: 0; border-radius: 16px; background: var(--card); box-shadow: var(--shadow); padding: 15px; font: inherit; font-size: 16px; font-weight: 700; color: var(--muted); cursor: pointer; }
    .bs .loading { display: flex; gap: 10px; align-items: center; padding: 18px 14px; color: var(--muted); font-weight: 600; font-size: 14px; }
    .bs .loading svg { animation: spin 0.9s linear infinite; }
    .bs .err { padding: 14px; color: var(--red); font-weight: 600; font-size: 14px; line-height: 1.45; }
    .toast { position: fixed; left: 16px; right: 16px; bottom: calc(18px + env(safe-area-inset-bottom)); z-index: 70; max-width: 520px; margin: 0 auto; display: flex; gap: 10px; align-items: center;
      background: #16181d; color: #fff; border-radius: 16px; padding: 13px 15px; font-size: 14px; font-weight: 600; line-height: 1.4; box-shadow: 0 10px 30px rgba(0,0,0,0.25); transform: translateY(150%); transition: transform .3s cubic-bezier(.2,.8,.2,1); }
    .toast.show { transform: none; }
    .toast.err { background: var(--red); }
    /* просмотр PDF */
    .viewer { position: fixed; inset: 0; z-index: 80; background: #2b2d31; display: flex; flex-direction: column; transform: translateY(100%); transition: transform .3s cubic-bezier(.2,.8,.2,1); visibility: hidden; }
    .viewer.show { transform: none; visibility: visible; }
    .v-bar { flex: none; display: flex; align-items: center; gap: 10px; padding: calc(10px + env(safe-area-inset-top)) 12px 10px; background: rgba(22,24,29,0.96); color: #fff; }
    .v-bar b { flex: 1; min-width: 0; font-size: 15px; font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .v-btn { flex: none; display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-width: 44px; height: 44px; border: 0; border-radius: 14px; background: rgba(255,255,255,0.12); color: #fff; font: inherit; font-size: 15px; font-weight: 700; padding: 0 12px; cursor: pointer; }
    .v-btn.pri { background: linear-gradient(180deg, var(--accent-2), var(--accent)); }
    .v-body { flex: 1; overflow: auto; -webkit-overflow-scrolling: touch; padding: 12px 10px calc(20px + env(safe-area-inset-bottom)); }
    .v-body canvas { display: block; width: 100%; max-width: 900px; height: auto; margin: 0 auto 12px; background: #fff; border-radius: 6px; box-shadow: 0 4px 18px rgba(0,0,0,0.35); }
    .v-msg { color: #c9ccd1; text-align: center; padding: 40px 16px; font-size: 14px; font-weight: 600; line-height: 1.5; }
    .note { display: none; margin-top: 10px; white-space: pre-wrap; font-size: 13px; font-weight: 500; line-height: 1.5; background: var(--fill); border-radius: 12px; padding: 11px; overflow-wrap: anywhere; }
    .note.open { display: block; }
    .note h4 { margin: 0 0 4px; font-size: 11px; font-weight: 800; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; }
    .note h4:not(:first-child) { margin-top: 10px; }
    .cfg { background: #fff; border-radius: 18px; padding: 14px 16px; margin-bottom: 12px; font-size: 14px; box-shadow: var(--shadow); }
    .cfg label { display: block; font-weight: 700; font-size: 13px; color: var(--muted); margin: 10px 0 6px; }
    .cfg input { width: 100%; padding: 12px 13px; font: inherit; font-size: 16px; font-weight: 600; border: 0; border-radius: 12px; background: var(--fill); box-shadow: inset 0 0 0 1px var(--sep); }
    .cfg input:focus { outline: none; box-shadow: inset 0 0 0 2px var(--accent); background: #fff; }
    .cfg button { margin-top: 12px; width: 100%; padding: 14px; border: none; border-radius: 14px; background: linear-gradient(180deg, var(--accent-2), var(--accent)); color: #fff; font: inherit; font-size: 15px; font-weight: 700; cursor: pointer; }
    .cfg[hidden] { display: none; }
    .foot { text-align: center; font-size: 12px; font-weight: 600; color: var(--muted); margin-top: 20px; }
    .foot button { background: none; border: none; color: var(--muted); text-decoration: underline; font: inherit; font-size: 12px; cursor: pointer; padding: 10px; }
  </style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <a class="icon-btn" href="index.html" title="Назад" aria-label="Назад"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></a>
    <h1>Текущие заказы<small id="stamp">загрузка…</small></h1>
    <button type="button" class="icon-btn" id="reload" title="Обновить" aria-label="Обновить"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg></button>
  </div>

  <div class="seg" id="seg">
    <button type="button" data-p="all" class="on">Все</button>
    <button type="button" data-p="Солнцезащитные системы">Шторы</button>
    <button type="button" data-p="Москитные сетки">Сетки</button>
  </div>
  <input class="search" id="q" type="search" placeholder="Клиент, телефон, адрес, №" autocomplete="off">

  <form class="cfg" id="cfg" hidden>
    <b>Подключение amoCRM</b>
    <div style="color:var(--muted); margin-top:4px; line-height:1.4;">То же, что в калькуляторах («Подключение amoCRM»). Если калькуляторы уже подключены на этом устройстве — заполнится само.</div>
    <label for="cfgUrl">Адрес посредника</label><input id="cfgUrl" type="url" placeholder="https://sp-amo.….workers.dev" autocomplete="off">
    <label for="cfgKey">Ключ доступа</label><input id="cfgKey" type="password" autocomplete="off">
    <button type="submit">Сохранить и загрузить</button>
  </form>

  <div class="msg" id="msg"></div>
  <div class="board" id="board"></div>
  <div class="foot" ><span id="footNote">Этап, документы и корректировка меняются прямо здесь — amoCRM обновляется сразу. «Изменить» — у заказов из калькулятора 2.44 и новее.</span><br><button type="button" id="cfgToggle">подключение amoCRM</button></div>
</div>

<div class="veil" id="veil"></div>
<div class="bs" id="bs" role="dialog" aria-modal="true"><div class="grab"></div><div id="bsBody"></div></div>
<div class="toast" id="toast" role="status"></div>
<div class="viewer" id="viewer" role="dialog" aria-modal="true">
  <div class="v-bar">
    <button type="button" class="v-btn" id="vClose" aria-label="Закрыть"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    <b id="vTitle"></b>
    <button type="button" class="v-btn pri" id="vShare"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12M7 8l5-5 5 5"/><path d="M5 13v6a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-6"/></svg><span>Сохранить</span></button>
  </div>
  <div class="v-body" id="vBody"></div>
</div>

<script>
  const CFG_KEY = 'spAmoConfig', CACHE_KEY = 'spOrdersCache', UI_KEY = 'spOrdersUi';
  const STAGES = ['Изготовление', 'Готов к установке', 'На установку'];
  const STAGE_COLOR = { 'Изготовление': '#ea580c', 'Готов к установке': '#0b72e7', 'На установку': '#15803d' };
  const $ = id => document.getElementById(id);
  const ls = { get(k, d) { try { return JSON.parse(localStorage.getItem(k)) || d; } catch (e) { return d; } }, set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} } };
  const esc = v => String(v == null ? '' : v).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const rub = v => `${Math.round(v || 0).toLocaleString('ru-RU')} ₽`;
  const norm = v => String(v || '').toLowerCase().replace(/ё/g, 'е');
  const ui = Object.assign({ pipe: 'all', closed: {} }, ls.get(UI_KEY, {}));
  let data = ls.get(CACHE_KEY, null);

  const I = {
    docs: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5M9 13h6M9 17h4"/></svg>',
    ext: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 4h6v6"/><path d="M20 4l-9 9"/><path d="M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></svg>',
    chev: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>',
    check: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7"/></svg>',
    flag: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 21V4M5 4h11l-2 4 2 4H5"/></svg>',
    spin: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-6.2-8.56"/></svg>',
    edit: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16z"/><path d="M13.5 6.5l4 4"/></svg>',
    user: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg>',
    phone: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1.9.4 1.8.7 2.7a2 2 0 0 1-.5 2.1L8 9.8a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.7.7a2 2 0 0 1 1.7 2z"/></svg>',
    pin: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg>',

  function cardHtml(l, pipeName, showPipe, stage) {

  function render() {

  async function load() {
    const cfg = ls.get(CFG_KEY, {});
    if (!cfg.url || !cfg.key) { showCfg(true); $('stamp').textContent = 'нужно подключение amoCRM'; return; }
    const btn = $('reload'); btn.classList.add('spin'); btn.disabled = true;
    $('msg').classList.remove('err'); $('msg').textContent = '';
    try {
      // до 3 попыток: мобильная сеть и VPN иногда обрывают запросы к *.workers.dev
      let d = null, lastErr = null;
      for (let attempt = 1; attempt <= 3 && !d; attempt++) {
        try {
          const r = await fetch(String(cfg.url).trim().replace(/\/+$/, '') + '/orders', { method: 'POST', headers: { 'X-App-Key': cfg.key, 'Content-Type': 'application/json' }, body: '{}', cache: 'no-store' });
          let j = null; try { j = await r.json(); } catch (e) {}
          if (j && j.error === 'Неизвестный адрес') throw Object.assign(new Error('Посредник amoCRM старой версии — обновите его в Cloudflare.'), { final: true });
          if (j && j.error && r.status !== 502) throw Object.assign(new Error(j.error), { final: true });   // ключ, адрес калькулятора — повтор не поможет
          if (!r.ok || !j || j.error) throw new Error(j && j.error ? j.error : `ответ ${r.status} не от посредника — похоже, сеть или VPN подменяет ответ`);
          d = j;
        } catch (e) {
          lastErr = e;
          if (e.final) break;

        }
      }
      if (!d) throw lastErr;
      data = d; ls.set(CACHE_KEY, d);
    } catch (e) {
      $('msg').classList.add('err');
      const m = String((e && e.message) || e);
      const net = /failed to fetch|load failed|networkerror|network request failed/i.test(m);
      $('msg').textContent = 'Не удалось обновить: ' + (net ? `нет связи с посредником amoCRM (${String(cfg.url).replace(/^https?:\/\//, '')}). Проверьте интернет; если адрес *.workers.dev не открывается у этого оператора — включите или выключите VPN. Также проверьте адрес в «подключение amoCRM».` : m) + (data ? ' Показаны последние загруженные данные.' : '');
    } finally { btn.classList.remove('spin'); btn.disabled = false; render(); }
  }

  // === Связь с amoCRM: этапы, документы ===
  async function api(path, body, blob) {
    const cfg = ls.get(CFG_KEY, {});
    if (!cfg.url || !cfg.key) throw new Error('нет подключения amoCRM');
    let last;
    for (let attempt = 1; attempt <= 2; attempt++) {
      try {
        const r = await fetch(String(cfg.url).trim().replace(/\/+$/, '') + path, { method: 'POST', headers: { 'X-App-Key': cfg.key, 'Content-Type': 'application/json' }, body: JSON.stringify(body || {}), cache: 'no-store' });
        if (blob && r.ok && !/json/.test(r.headers.get('Content-Type') || '')) return { blob: await r.blob(), name: decodeURIComponent(r.headers.get('X-File-Name') || '') };
        let j = null; try { j = await r.json(); } catch (e) {}
        if (j && j.error === 'Неизвестный адрес') throw Object.assign(new Error('Посредник amoCRM старой версии — он обновится сам через пару минут после выкладки.'), { final: true });
        if (!r.ok || !j || j.error) throw Object.assign(new Error(j && j.error ? j.error : `посредник ответил ${r.status}`), { final: !!(j && j.error) });
        return j;
      } catch (e) {
        last = e; if (e.final) break;
        if (attempt < 2) await new Promise(res => setTimeout(res, 900));
      }
    }
    const m = String((last && last.message) || last);
    throw new Error(/failed to fetch|load failed|networkerror/i.test(m) ? 'нет связи с посредником amoCRM — проверьте интернет или VPN' : m);
  }
  let toastTmr = null;

  function openSheet(html) { $('bsBody').innerHTML = html; $('veil').classList.add('show'); $('bs').classList.add('show'); $('bs').scrollTop = 0; }

  const docCache = {};

  async function docsSheet(id) {

  // просмотр PDF прямо в приложении (pdf.js), «Сохранить» — поделиться / скачать файл
  let pdfjsP = null, curDoc = null;
  function loadPdfJs() {
    if (window.pdfjsLib) return Promise.resolve(window.pdfjsLib);
    return pdfjsP || (pdfjsP = new Promise((res, rej) => {
      const sc = document.createElement('script'); sc.src = 'vendor/pdfjs/pdf.js';   // pdf.js 3.11.174 (legacy), лежит в приложении — без внешних CDN
      sc.onload = () => { window.pdfjsLib.GlobalWorkerOptions.workerSrc = 'vendor/pdfjs/pdf.worker.js'; res(window.pdfjsLib); };
      sc.onerror = () => { pdfjsP = null; rej(new Error('не загрузился просмотрщик PDF')); }; document.head.appendChild(sc);
    }));
  }
  async function openDoc(leadId, uuid, name) {
    $('vTitle').textContent = name; $('viewer').classList.add('show'); curDoc = null;
    $('vBody').innerHTML = `<div class="v-msg">${I.spin.replace('<svg', '<svg style="animation: spin 0.9s linear infinite; vertical-align: -3px; margin-right: 6px;"')}Загружаю «${esc(name)}»…</div>`;
    try {
      const got = docCache[uuid] || (docCache[uuid] = await api('/doc', { lead_id: leadId, uuid }, true));
      if (!got.blob) throw new Error('посредник не вернул файл');
      curDoc = { blob: got.blob, name: got.name || name };
      if (!/pdf/i.test(got.blob.type) && !/\.pdf$/i.test(name)) { $('vBody').innerHTML = '<div class="v-msg">Это не PDF — нажмите «Сохранить», чтобы открыть файл.</div>'; return; }
      const lib = await loadPdfJs();
      const pdf = await lib.getDocument({ data: new Uint8Array(await got.blob.arrayBuffer()) }).promise;
      $('vBody').innerHTML = '';
      const w = Math.min($('vBody').clientWidth - 20, 900), dpr = Math.min(window.devicePixelRatio || 1, 2.5);
      for (let i = 1; i <= pdf.numPages; i++) {
        if (!$('viewer').classList.contains('show')) return;
        const page = await pdf.getPage(i), v1 = page.getViewport({ scale: 1 }), vp = page.getViewport({ scale: (w / v1.width) * dpr });
        const c = document.createElement('canvas'); c.width = vp.width; c.height = vp.height; $('vBody').appendChild(c);
        await page.render({ canvasContext: c.getContext('2d'), viewport: vp }).promise;
      }
    } catch (err) {
      if (curDoc) $('vBody').innerHTML = `<div class="v-msg">Не получилось показать файл здесь (${esc(err.message)}). Нажмите «Сохранить», чтобы открыть его.</div>`;
      else $('vBody').innerHTML = `<div class="v-msg">Не удалось загрузить файл: ${esc(err.message)}</div>`;
    }
  }

  $('vShare').addEventListener('click', async () => {

  // Корректировка: данные заказа калькулятора (сохранены посредником при отправке) → «Новый заказ» в режиме корректировки
  function idbPut(db, key, val) {
    return new Promise(res => { try { const r = indexedDB.open(db, 1); r.onupgradeneeded = () => r.result.createObjectStore('kv');
      r.onsuccess = () => { try { const tx = r.result.transaction('kv', 'readwrite'); tx.objectStore('kv').put(val, key); tx.oncomplete = () => { r.result.close(); res(true); }; tx.onerror = () => { r.result.close(); res(false); }; } catch (e) { res(false); } };
      r.onerror = () => res(false); } catch (e) { res(false); } });
  }
  function idbDel(db, key) { return new Promise(res => { try { const r = indexedDB.open(db, 1); r.onupgradeneeded = () => r.result.createObjectStore('kv');
    r.onsuccess = () => { try { const tx = r.result.transaction('kv', 'readwrite'); tx.objectStore('kv').delete(key); tx.oncomplete = () => { r.result.close(); res(); }; } catch (e) { res(); } }; r.onerror = () => res(); } catch (e) { res(); } }); }
  const CALC_IDS = ['uni', 'uni2', 'zebra', 'zebra2', 'vert', 'horiz', 'mesh', 'plisse'];
  async function editOrder(leadId, btn) {

    if (cur && cur.id) {
      const sent = !!localStorage.getItem('spComboLead2:' + cur.id);
      const unsent = sent ? !!(cur.sentSig && cur.sig && cur.sig !== cur.sentSig) : !!((cur.parts || []).length || (cur.services || []).length || (cur.client || {}).clientName);
      if (unsent && Number(localStorage.getItem('spComboLead2:' + cur.id)) !== leadId &&
        !confirm('Есть незаконченный заказ, не отправленный в amoCRM. Открыть корректировку вместо него? Незаконченный заказ удалится.')) return;
    }
    const old = btn.innerHTML; btn.disabled = true; btn.textContent = 'Загружаю…';
    try {
      const r = await fetch(String(cfg.url).trim().replace(/\/+$/, '') + '/state-get', { method: 'POST', headers: { 'X-App-Key': cfg.key, 'Content-Type': 'application/json' }, body: JSON.stringify({ lead_id: leadId }), cache: 'no-store' });
      let j = null; try { j = await r.json(); } catch (e) {}
      if (!r.ok || !j || !j.state) throw new Error(j && j.error ? j.error : `посредник ответил ${r.status}`);
      const S = j.state, combo = S.combo || {};
      // убрать текущий заказ (его разделы и фото)
      if (cur && cur.id) {
        Object.keys(localStorage).filter(k => k.endsWith('@combo:' + cur.id)).forEach(k => localStorage.removeItem(k));
        await Promise.all(CALC_IDS.map(n => idbDel(n + 'CalcPhotos', 'photos@combo:' + cur.id)));
      }
      // заказ из amoCRM: свой номер раздела, чтобы не смешаться с другими
      const id = 'e' + leadId + '-' + Date.now().toString(36);
      Object.entries(S.ls || {}).forEach(([k, v]) => localStorage.setItem(k.replace(/@combo:.*$/, '@combo:' + id), v));
      for (const [calc, v] of Object.entries(S.photos || {})) await idbPut(calc + 'CalcPhotos', 'photos@combo:' + id, v);
      Object.assign(combo, { id, editLead: leadId, fresh: true, sum: {}, sentSig: null, sig: null });
      if (!Array.isArray(combo.services)) combo.services = [];
      localStorage.setItem('spCombo2', JSON.stringify(combo));
      localStorage.setItem('spComboLead2:' + id, String(leadId));
      location.href = 'combo.html';
    } catch (e) {
      btn.disabled = false; btn.innerHTML = old;
      $('msg').classList.add('err'); $('msg').textContent = 'Не удалось открыть заказ для корректировки: ' + String((e && e.message) || e);
      $('msg').scrollIntoView({ block: 'center', behavior: 'smooth' });
    }
  }

  function showCfg(on) {
    const f = $('cfg'); f.hidden = !on;
    if (on) { const c = ls.get(CFG_KEY, {}); $('cfgUrl').value = c.url || ''; $('cfgKey').value = c.key || ''; }
  }
  $('cfg').addEventListener('submit', e => {
    e.preventDefault();
    const url = $('cfgUrl').value.trim(), key = $('cfgKey').value.trim();
    if (!/^https:\/\//.test(url) || !key) { $('msg').classList.add('err'); $('msg').textContent = 'Введите адрес посредника (начинается с https://) и ключ.'; return; }
    ls.set(CFG_KEY, { url, key }); showCfg(false); load();
  });
  $('cfgToggle').addEventListener('click', () => showCfg($('cfg').hidden));
  $('reload').addEventListener('click', load);
  $('seg').addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; ui.pipe = b.dataset.p; ls.set(UI_KEY, ui); render(); });
  $('q').addEventListener('input', render);
  $('board').addEventListener('click', e => {
    const head = e.target.closest('.col-head');
    if (head) { const st = head.parentElement.dataset.stage; ui.closed[st] = !ui.closed[st]; ls.set(UI_KEY, ui); head.parentElement.classList.toggle('closed'); return; }
    const ed = e.target.closest('[data-edit]');
    if (ed) { editOrder(Number(ed.dataset.edit), ed); return; }
    const more = e.target.closest('.btn-more');
    if (more) { const n = more.closest('.card').querySelector('.note'); n.classList.toggle('open'); more.textContent = n.classList.contains('open') ? 'Свернуть' : 'Подробнее'; return; }
    const sb = e.target.closest('[data-stage-of]');
    if (sb) { stageSheet(Number(sb.dataset.stageOf)); return; }
    const db = e.target.closest('[data-docs]');
    if (db) { docsSheet(Number(db.dataset.docs)); return; }
  });
  document.addEventListener('visibilitychange', () => { if (!document.hidden && data && Date.now() - (data.updated || 0) > 5 * 60 * 1000) load(); });

  render(); load();
  if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
</html>
