<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Комбинированный заказ — SunProtection</title>
  <meta name="theme-color" content="#f5f4f1">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" href="icons/favicon-64.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <style>
    :root {
      --bg: #f5f4f1; --card: #ffffff; --ink: #16181d; --ink2: #3f434b; --muted: #8a8f98; --sep: rgba(22,24,29,0.08);
      --fill: #f3f2ef; --accent: #ea580c; --accent-2: #f97316; --accent-ink: #c2410c; --accent-soft: #fff1e8; --green: #15803d; --green-soft: #ecfdf3; --red: #dc2626; --red-soft: #fef2f2;
      --blue: #0b72e7; --blue-soft: #e8f3ff; --slate: #334155; --slate-soft: #eef1f5; --violet: #7c3aed; --violet-soft: #f3effd;
      --r: 18px; --ease: cubic-bezier(.2,.8,.2,1); --shadow: 0 1px 2px rgba(16,24,40,0.04), 0 6px 20px rgba(16,24,40,0.05);
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; }
    body { font-family: "Manrope", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-feature-settings: "tnum" 1, "cv11" 1; background: var(--bg); color: var(--ink);
      font-size: 16px; line-height: 1.35; -webkit-font-smoothing: antialiased; padding-bottom: calc(150px + env(safe-area-inset-bottom)); }
    button { font-family: inherit; }
    .wrap { max-width: 600px; margin: 0 auto; padding: 0 16px; }

    /* навигация */
    .nav { position: sticky; top: 0; z-index: 20; display: flex; align-items: center; justify-content: space-between; padding: calc(8px + env(safe-area-inset-top)) 8px 8px;
      background: rgba(245,244,241,0.92); backdrop-filter: saturate(180%) blur(20px); -webkit-backdrop-filter: saturate(180%) blur(20px); transition: box-shadow .2s; }
    .nav.scrolled { box-shadow: 0 0.5px 0 var(--sep); }
    .nav a, .nav button { display: inline-flex; align-items: center; gap: 2px; color: var(--accent); font-size: 17px; text-decoration: none; background: none; border: 0; padding: 8px; border-radius: 10px; cursor: pointer; }
    .nav .nav-title { position: absolute; left: 50%; transform: translateX(-50%); max-width: calc(100% - 210px); overflow: hidden; text-overflow: ellipsis; font-size: 17px; font-weight: 600; color: var(--ink); opacity: 0; transition: opacity .2s; white-space: nowrap; pointer-events: none; }
    .nav.scrolled .nav-title { opacity: 1; }
    .large { font-size: 30px; font-weight: 800; letter-spacing: -0.03em; line-height: 1.1; margin: 6px 0 6px; }
    .large-sub { color: var(--muted); font-size: 15px; margin-bottom: 18px; min-height: 20px; }

    /* сгруппированные списки */
    .sec-h { font-size: 12px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: 0.08em; margin: 22px 16px 7px; display: flex; justify-content: space-between; align-items: baseline; }
    .sec-h:first-of-type { margin-top: 4px; }
    .sec-f { font-size: 13px; color: var(--muted); margin: 7px 16px 0; line-height: 1.4; }
    .group { background: var(--card); border-radius: var(--r); overflow: hidden; box-shadow: var(--shadow); }
    .row { display: flex; align-items: center; gap: 12px; min-height: 48px; padding: 0 16px; position: relative; }
    .row + .row::before, .row + .part-body::before { content: ''; position: absolute; top: 0; left: 16px; right: 0; border-top: 0.5px solid var(--sep); }
    .row.ind + .row::before { left: 58px; }
    .row label, .row .lbl { flex: none; width: 112px; color: var(--ink2); font-size: 15px; font-weight: 500; }
    .row input, .row textarea { flex: 1; min-width: 0; border: 0; background: transparent; font: inherit; font-weight: 600; color: var(--ink); padding: 13px 0; outline: none; text-align: right; }
    .row textarea { text-align: left; resize: none; min-height: 48px; padding: 13px 0; field-sizing: content; }
    .row input::placeholder, .row textarea::placeholder { color: #c3c6cc; font-weight: 500; }
    .row.tap { cursor: pointer; }
    .row.tap:active { background: var(--fill); }
    .val { flex: 1; text-align: right; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .chev { flex: none; color: #c4c4c6; transition: transform .25s var(--ease); }
    .chev.down { transform: rotate(90deg); }
    .part.open .part-head .chev, #clientBox.open .client-sum .chev, #marginBox.open .chev.rot { transform: rotate(90deg); }
    .pill { display: inline-flex; align-items: center; gap: 6px; border: 0; border-radius: 999px; padding: 7px 12px; background: var(--fill); color: var(--ink); font-size: 15px; cursor: pointer; }
    .pill svg { color: var(--muted); }
    .num-hint { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 0 16px 12px; font-size: 13px; color: var(--muted); margin-top: -4px; }
    .num-hint:empty { display: none; }
    .num-hint button { border: 0; background: var(--accent-soft); color: var(--accent); font-weight: 600; font-size: 14px; border-radius: 999px; padding: 6px 12px; cursor: pointer; }

    /* сворачиваемые блоки */
    .fold { display: grid; grid-template-rows: 0fr; transition: grid-template-rows .3s var(--ease); }
    .open > .fold { grid-template-rows: 1fr; }
    .fold > div { overflow: hidden; }
    .client-sum { display: flex; align-items: center; gap: 12px; padding: 12px 16px; cursor: pointer; min-height: 64px; }
    .avatar { flex: none; width: 44px; height: 44px; border-radius: 14px; background: var(--accent-soft); color: var(--accent-ink); font-weight: 800; font-size: 16px; display: flex; align-items: center; justify-content: center; }
    .cs-main { flex: 1; min-width: 0; }
    .cs-name { font-size: 17px; font-weight: 700; letter-spacing: -0.01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .cs-sub { font-size: 14px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 1px; }

    /* изделия */
    .part { background: var(--card); border-radius: var(--r); overflow: hidden; margin-bottom: 12px; box-shadow: var(--shadow); }
    .part-head { display: flex; align-items: center; gap: 12px; padding: 12px 14px 12px 12px; cursor: pointer; min-height: 64px; }
    .p-icon { flex: none; width: 44px; height: 44px; border-radius: 14px; display: flex; align-items: center; justify-content: center; }
    .p-icon.sun { background: var(--accent-soft); color: var(--accent); }
    .p-icon.mos { background: var(--blue-soft); color: var(--blue); }
    .p-main { flex: 1; min-width: 0; }
    .p-name { font-size: 16px; font-weight: 700; line-height: 1.25; letter-spacing: -0.01em; }
    .p-sub { font-size: 13px; color: var(--muted); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .p-sub.err { color: var(--red); white-space: normal; display: flex; gap: 5px; align-items: flex-start; }
    .p-sub.err svg { flex: none; margin-top: 1px; }
    .p-sum { flex: none; font-size: 16px; font-weight: 700; font-variant-numeric: tabular-nums; }
    .part-body { position: relative; }
    .it { display: flex; gap: 10px; padding: 10px 14px 10px 12px; position: relative; }
    .it::before { content: ''; position: absolute; top: 0; left: 64px; right: 0; border-top: 0.5px solid var(--sep); }
    .it-n { flex: none; width: 42px; text-align: center; }
    .it-n span { display: inline-flex; min-width: 26px; height: 26px; padding: 0 6px; border-radius: 9px; background: var(--fill); color: var(--ink2); font-size: 13px; font-weight: 700; align-items: center; justify-content: center; font-variant-numeric: tabular-nums; }
    .it-main { flex: 1; min-width: 0; }
    .it-room { font-size: 15px; font-weight: 700; }
    .it-text { font-size: 14px; color: var(--muted); margin-top: 1px; }
    .it-sum { flex: none; font-size: 15px; font-variant-numeric: tabular-nums; color: var(--ink2); padding-top: 1px; }
    .p-det { font-size: 13px; color: var(--muted); padding: 0 14px 10px 66px; line-height: 1.45; }
    .p-act { display: flex; border-top: 0.5px solid var(--sep); }
    .p-act button { flex: 1; display: inline-flex; align-items: center; justify-content: center; gap: 7px; border: 0; background: none; padding: 14px; font-size: 15px; color: var(--accent-ink); cursor: pointer; font-weight: 700; }
    .p-act button + button { border-left: 0.5px solid var(--sep); }
    .p-act button.del { color: var(--red); flex: 0 0 34%; }
    .p-act button:active { background: var(--fill); }

    .add-btn { width: 100%; display: flex; align-items: center; justify-content: center; gap: 8px; border: 0; background: var(--card); color: var(--accent);
      border-radius: var(--r); padding: 17px; font-size: 16px; font-weight: 700; cursor: pointer; transition: transform .15s; box-shadow: var(--shadow); }
    .add-btn .plus { display: inline-flex; width: 26px; height: 26px; border-radius: 9px; background: var(--accent); color: #fff; align-items: center; justify-content: center; }
    .add-btn:active { transform: scale(0.98); }
    .empty { text-align: center; padding: 26px 20px 8px; color: var(--muted); font-size: 15px; line-height: 1.45; }
    .empty .e-ic { width: 68px; height: 68px; margin: 0 auto 14px; border-radius: 22px; background: var(--accent-soft); display: flex; align-items: center; justify-content: center; color: var(--accent); }
    .empty b { display: block; color: var(--ink); font-size: 17px; margin-bottom: 4px; }

    .money { font-variant-numeric: tabular-nums; }
    .row .money { flex: 1; text-align: right; }
    .row.total .lbl, .row.total .money { font-weight: 800; font-size: 19px; letter-spacing: -0.01em; color: var(--ink); }
    .row.total .money { color: var(--ink); }
    .green { color: var(--green) !important; } .redc { color: var(--red) !important; }

    /* нижняя панель */
    .dock { position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; background: rgba(255,255,255,0.9); backdrop-filter: saturate(180%) blur(20px); -webkit-backdrop-filter: saturate(180%) blur(20px);
      border-top: 0.5px solid var(--sep); padding: 10px 16px calc(10px + env(safe-area-inset-bottom)); transform: translateY(0); transition: transform .3s var(--ease); }
    .dock.hide { transform: translateY(110%); }
    .dock-in { max-width: 600px; margin: 0 auto; }
    .dock-top { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 8px; gap: 10px; }
    .dock-top span { color: var(--muted); font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .dock-top b { font-size: 24px; font-weight: 800; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; white-space: nowrap; }
    .dock-btns { display: flex; gap: 10px; }
    .dbtn { flex: 1; display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: 0; border-radius: 16px; padding: 15px 10px; font-size: 16px; font-weight: 700; cursor: pointer; transition: transform .12s, opacity .2s; }
    .dbtn:active { transform: scale(0.97); }
    .dbtn:disabled { opacity: 0.4; }
    .dbtn.sec { background: var(--fill); color: var(--ink); box-shadow: inset 0 0 0 1px var(--sep); }
    .dbtn.pri { background: linear-gradient(180deg, var(--accent-2), var(--accent)); color: #fff; box-shadow: 0 6px 16px rgba(234,88,12,0.28); }
    .toast { display: flex; gap: 10px; align-items: flex-start; font-size: 13px; font-weight: 600; line-height: 1.45; padding: 10px 12px; border-radius: 14px; background: var(--fill); margin-bottom: 10px; color: var(--ink2); }
    .toast .t-ic { flex: none; width: 22px; height: 22px; border-radius: 7px; display: flex; align-items: center; justify-content: center; background: #fff; }
    .toast.busy .t-ic svg { animation: spin 0.9s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .toast:empty { display: none; }
    .toast.ok { background: var(--green-soft); color: var(--green); } .toast.warn { background: #fff7e6; color: #b45309; } .toast.err { background: var(--red-soft); color: var(--red); }
    .toast a { color: inherit; font-weight: 700; }

    /* выпадающее меню */
    .menu-bg { position: fixed; inset: 0; z-index: 90; background: rgba(0,0,0,0.12); opacity: 0; transition: opacity .18s; }
    .menu-bg.on { opacity: 1; }
    .menu { position: fixed; z-index: 91; min-width: 250px; max-width: calc(100vw - 24px); max-height: 70vh; overflow-y: auto; background: rgba(255,255,255,0.97); backdrop-filter: blur(30px); -webkit-backdrop-filter: blur(30px);
      border-radius: 14px; box-shadow: 0 10px 40px rgba(0,0,0,0.2), 0 0 0 0.5px rgba(0,0,0,0.06); transform: scale(0.92); opacity: 0; transition: transform .2s var(--ease), opacity .15s; }
    .menu.on { transform: scale(1); opacity: 1; }
    .m-h { font-size: 11px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: 0.08em; padding: 12px 16px 4px; }
    .m-i { width: 100%; display: flex; align-items: center; gap: 12px; border: 0; background: none; text-align: left; padding: 11px 16px; font-size: 15px; font-weight: 600; color: var(--ink); cursor: pointer; position: relative; }
    .m-i + .m-i::before { content: ''; position: absolute; top: 0; left: 16px; right: 0; border-top: 0.5px solid var(--sep); }
    .m-i:active, .m-i:hover { background: rgba(0,0,0,0.05); }
    .m-i .m-l { flex: 1; min-width: 0; }
    .m-i .m-s { display: block; font-size: 12px; font-weight: 500; color: var(--muted); margin-top: 1px; }
    .m-i .m-r { color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
    .m-i .m-ic { flex: none; width: 34px; height: 34px; border-radius: 11px; display: flex; align-items: center; justify-content: center; }
    .m-i .m-ic svg { width: 18px; height: 18px; }
    .m-i .m-ck { flex: none; width: 20px; color: var(--accent); display: flex; }
    .m-i.danger { color: var(--red); }
    .m-sep { height: 8px; background: rgba(0,0,0,0.04); }

    /* редактор раздела */
    #sheet { position: fixed; left: -12000px; top: 0; width: 100vw; height: 100vh; height: 100dvh; background: var(--bg); z-index: 50; display: flex; flex-direction: column; transform: translateY(30px); opacity: 0; transition: transform .3s var(--ease), opacity .25s; }
    #sheet.open { left: 0; transform: none; opacity: 1; }
    .sh-bar { flex: none; display: flex; align-items: center; gap: 10px; padding: calc(10px + env(safe-area-inset-top)) 16px 10px; background: rgba(255,255,255,0.96); border-bottom: 0.5px solid var(--sep); }
    .sh-bar .p-icon { width: 36px; height: 36px; border-radius: 11px; }
    .sh-bar .p-icon svg { width: 20px; height: 20px; }
    .sh-bar b { flex: 1; min-width: 0; font-size: 17px; font-weight: 800; letter-spacing: -0.01em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .sh-bar button { display: inline-flex; align-items: center; gap: 6px; border: 0; border-radius: 12px; background: linear-gradient(180deg, var(--accent-2), var(--accent)); color: #fff; font-size: 15px; font-weight: 700; padding: 10px 16px; cursor: pointer; }
    .sh-body { flex: 1; position: relative; }
    .sh-body iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; visibility: hidden; background: var(--bg); }
    .sh-body iframe.on { visibility: visible; }
    #printArea { display: none; }
    @media print { .wrap, .nav, .dock, #sheet { display: none !important; } #printArea { display: block !important; } body { padding: 0; background: #fff; } }
    @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
  </style>
</head>
<body>
<div class="nav" id="nav">
  <a href="index.html#new"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>Назад</a>
  <span class="nav-title" id="navTitle">Комбинированный заказ</span>
  <button type="button" id="moreBtn" aria-label="Ещё"><svg width="26" height="26" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="5" cy="12" r="1.9"/><circle cx="12" cy="12" r="1.9"/><circle cx="19" cy="12" r="1.9"/></svg></button>
</div>
<div class="wrap">
  <div class="large">Комбинированный заказ</div>
  <div class="large-sub" id="sub"></div>

  <div class="sec-h">Клиент</div>
  <div class="group" id="clientBox">
    <div class="client-sum" id="clientSum"></div>
    <div class="fold"><div>
      <div class="row"><label for="orderNumber">Номер заказа</label><input id="orderNumber" type="text" inputmode="numeric" placeholder="например, 35" autocomplete="off"></div>
      <div class="num-hint" id="numHint"></div>
      <div class="row"><label for="clientName">Имя</label><input id="clientName" type="text" placeholder="Клиент" autocomplete="off"></div>
      <div class="row"><label for="clientPhone">Телефон</label><input id="clientPhone" type="tel" placeholder="+7 …" autocomplete="off"></div>
      <div class="row"><label for="clientAddress">Адрес</label><input id="clientAddress" type="text" placeholder="Улица, дом, квартира" autocomplete="off"></div>
      <div class="row"><label for="prepay">Предоплата</label><input id="prepay" type="number" inputmode="decimal" min="0" placeholder="0 ₽"></div>
      <div class="row"><label for="orderNote">Заметка</label><textarea id="orderNote" rows="1" placeholder="Например: установка через неделю"></textarea></div>
    </div></div>
  </div>

  <div class="sec-h"><span>Изделия</span><span id="itemsCount"></span></div>
  <div id="parts"></div>
  <button type="button" class="add-btn" id="addBtn"><span class="plus"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></span>Добавить изделие<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg></button>

  <div id="priceArea">
    <div class="sec-h">Стоимость</div>
    <div class="group">
      <div class="row tap" id="priceRow"><span class="lbl">Цена</span><span class="val" id="priceVal"></span><svg class="chev down" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg></div>
      <div id="sums"></div>
    </div>
    <div class="group" id="marginBox" style="margin-top: 10px;">
      <div class="row tap" id="marginRow"><span class="lbl" style="width:auto;">Себестоимость и маржа</span><span class="val"></span><svg class="chev rot" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg></div>
      <div class="fold"><div id="marginBody"></div></div>
    </div>
    <div class="sec-h">amoCRM</div>
    <div class="group">
      <div class="row tap" id="pipeRow"><span class="lbl">Воронка</span><span class="val" id="pipeVal"></span><svg class="chev down" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg></div>
    </div>
    <div class="sec-f">Уходит одной сделкой на всю сумму: все изделия, КП, заказ-наряд с раскроем и наклейки.</div>
    <input type="hidden" id="pipeline">
  </div>
</div>

<div class="dock" id="dock"><div class="dock-in">
  <div class="toast" id="status"></div>
  <div class="dock-top"><span id="dockLbl">Итого</span><b id="dockSum">0 ₽</b></div>
  <div class="dock-btns">
    <button type="button" class="dbtn sec" id="docsBtn"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/></svg>Документы<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 15l6-6 6 6"/></svg></button>
    <button type="button" class="dbtn pri" id="amoBtn"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 2L11 13"/><path d="M22 2l-7 20-4-9-9-4z"/></svg>В amoCRM</button>
  </div>
</div></div>

<div id="sheet" aria-hidden="true">
  <div class="sh-bar"><span class="p-icon" id="shIcon"></span><b id="shTitle"></b><button type="button" id="shDone"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7"/></svg>Готово</button></div>
  <div class="sh-body" id="shBody"></div>
</div>
<div id="printArea"></div>
<script>
    // === Сборка PDF из HTML (общая для калькуляторов и «Комбинированного заказа») ===

      <div style="font-size: 14px; font-weight: 800; text-transform: uppercase; margin: 14px 0 6px;">Состав заказа</div>
      <table style="width: 100%; border-collapse: collapse; font-size: 12px;"><thead><tr style="background: #ecf0f1;"><th style="${td}">№</th><th style="${td} text-align: left;">Изделие</th><th style="${td} text-align: left;">Помещение</th><th style="${td} text-align: left;">Размеры и параметры</th></tr></thead>
      <tbody>${partsSum().flatMap(p => p.items.map(it => `<tr><td style="${td} text-align: center; font-weight: bold;">${it.n}</td><td style="${td}">${esc(p.name)}</td><td style="${td} font-weight: bold;">${esc(it.room || '—')}</td><td style="${td}">${esc(it.text)}</td></tr>`)).join('')}</tbody></table>
      <div style="font-size: 14px; font-weight: 800; text-transform: uppercase; margin: 14px 0 6px;">Экономика заказа</div>
      <table style="width: 100%; border-collapse: collapse; font-size: 12px;"><thead><tr style="background: #ecf0f1;"><th style="${td} text-align: left;">Раздел</th><th style="${td}">Себестоимость</th><th style="${td}">Для клиента</th><th style="${td}">Маржа</th></tr></thead>
      <tbody>${partsSum().map(p => `<tr><td style="${td}">${esc(p.name)}${p.noInstall ? ' (без монтажа)' : ''}</td><td style="${td} text-align: right;">${rub(p.cost)}</td><td style="${td} text-align: right;">${rub(p.prices[sel])}</td><td style="${td} text-align: right;">${rub(p.profitOf[sel])}</td></tr>`).join('')}
      <tr style="font-weight: bold;"><td style="${td}">Итого</td><td style="${td} text-align: right;">${rub(cost)}</td><td style="${td} text-align: right;">${rub(tot)}</td><td style="${td} text-align: right;">${rub(profit)} · ${tot > 0 ? Math.round(profit / tot * 100) : 0}%</td></tr></tbody></table>
      <div style="font-size: 11px; color: #7f8c8d; margin-top: 10px;">Дальше — заказ-наряды по разделам: спецификация, раскрой ткани и металла, комплектующие. Номера изделий сквозные.</div></div>`);
  }
  async function pagesOf(html) { $('printArea').innerHTML = html; return printAreaToPages(); }
  async function buildKp() { return buildJpegPdf(await pagesOf(kpHtml())); }
  async function buildOrder(progress) {
    const ids = await readyAll();
    const pages = await pagesOf(orderHeadHtml());
    for (const id of ids) {
      if (progress) progress(`⏳ Заказ-наряд: ${CALC[id].name}…`);
      const w = frames[id].win;
      await w.buildPrintAreaSilently();
      pages.push(...await w.printAreaToPages(x => !x.classList.contains('kp-part')));
    }
    return buildJpegPdf(pages);
  }
  async function buildLabels() {
    const ids = await readyAll();
    let all = [], W = 0, H = 0, first = null;
    for (const id of ids) { const w = frames[id].win, r = w.makeLabelsPdf(); if (!first) { first = w; W = r.W; H = r.H; } all = all.concat(r.pages); }
    if (!all.length) throw new Error('нет изделий для наклеек');
    return first.buildLabelsPdf(all, W, H);
  }
  let toastTmr = null;
  function setStatus(html, kind) {
    const t = $('status');
    const m = String(html || '').match(/^(⏳|✓|✕|⚠)\s*/);
    if (m) { html = html.slice(m[0].length); kind = kind || { '⏳': 'busy', '✓': 'ok', '✕': 'err', '⚠': 'warn' }[m[1]]; }
    const ic = { busy: IC.spin, ok: IC.check, err: IC.x, warn: IC.alert }[kind];
    t.className = 'toast' + (kind ? ' ' + kind : '');
    t.innerHTML = html ? (ic ? `<span class="t-ic">${ic}</span>` : '') + `<span>${html}</span>` : '';
    clearTimeout(toastTmr); if (kind === 'ok') toastTmr = setTimeout(() => { t.innerHTML = ''; }, 9000);
  }
  async function run(btn, fn) {
    const b = $(btn); b.disabled = true;
    try { await fn(); } catch (e) { setStatus('✕ ' + esc((e && e.message) || e), 'err'); } finally { b.disabled = false; render(); }
  }
  $('docsBtn').onclick = () => menu($('docsBtn'), [
    { label: 'КП для клиента', sub: 'Одно на весь заказ', icon: DOC_IC.kp, act: () => run('docsBtn', async () => { await readyAll(); setStatus('⏳ Готовлю КП…'); download(await buildKp(), fileName('КП')); setStatus('✓ КП готово — файл скачан', 'ok'); }) },
    { label: 'Заказ-наряд', sub: 'Для цеха: раскрой всех изделий', icon: DOC_IC.order, bg: 'var(--slate-soft)', fg: 'var(--slate)', act: () => run('docsBtn', async () => { setStatus('⏳ Готовлю заказ-наряд…'); download(await buildOrder(h => setStatus(h)), fileName('Заказ-наряд')); setStatus('✓ Заказ-наряд готов — файл скачан', 'ok'); }) },
    { label: 'Наклейки', sub: 'Термопринтер, на каждое изделие', icon: DOC_IC.labels, bg: 'var(--violet-soft)', fg: 'var(--violet)', act: () => run('docsBtn', async () => { setStatus('⏳ Готовлю наклейки…'); download(await buildLabels(), fileName('Наклейки')); setStatus('✓ Наклейки готовы — файл скачан', 'ok'); }) }
  ], { width: 290 });

  // === amoCRM: одна сделка ===
  function street(addr) {
    const ps = String(addr || '').split(',').map(x => x.trim()).filter(x => /[a-zа-яё]/i.test(x));
    const p = ps.find(x => /[a-zа-яё].*\d/i.test(x)) || ps[ps.length - 1] || '';
    return p.replace(/^(г\.?|город|ул\.?|улица|пр-т\.?|пр\.?|проспект|пер\.?|переулок|бул\.?|бульвар|ш\.?|шоссе|мкр\.?|д\.?)\s+/i, '').replace(/\s*\d.*$/, '').trim();
  }
  async function call(cfg, path, init) {
    let r; for (let a = 1; ; a++) { try { r = await fetch(String(cfg.url).trim().replace(/\/+$/, '') + path, { ...init, headers: { 'X-App-Key': cfg.key, ...(init.headers || {}) } }); break; } catch (e) { if (a >= 2 || path === '/lead') throw new Error('нет связи с посредником amoCRM — проверьте интернет или VPN'); await sleep(1200); } }
    let d = {}; try { d = await r.json(); } catch (e) {}
    if (!r.ok || d.error) throw new Error(d.error || `посредник ответил ${r.status}`);
    return d;
  }
  $('amoBtn').onclick = () => run('amoBtn', async () => {
    let cfg = {}; try { cfg = JSON.parse(localStorage.getItem(CFG_KEY) || '{}') || {}; } catch (e) {}
    if (!cfg.url || !cfg.key) throw new Error('подключение amoCRM не настроено — откройте любой калькулятор → «⚙ Подключение amoCRM»');
    const c = st.client;
    if (!c.orderNumber && !confirm('Номер заказа не указан. Всё равно отправить?')) return;
    const leadKey = `spComboLead2:${st.id}`;
    let leadId = 0; try { leadId = Number(localStorage.getItem(leadKey)) || 0; } catch (e) {}
    if (leadId && !confirm(`Этот заказ уже отправлен в сделку №${leadId}. ОК — обновить её (сумма, примечание, файлы).`)) return;
    setStatus('⏳ Готовлю документы: КП, заказ-наряд, наклейки…');
    const orderBlob = await buildOrder(h => setStatus(h));
    const kpBlob = await buildKp();
    let labelsBlob = null; try { labelsBlob = await buildLabels(); } catch (e) {}
    const sel = st.priceSel, ps = partsSum(), tot = total(sel), pre = Math.max(0, parseFloat(String(c.prepay || '').replace(',', '.')) || 0);
    const short = n => n.replace(/^Рулонные шторы /, '');
    const items = ps.flatMap(p => p.items.map(it => `${short(p.name)}: ${it.field}`));
    const fields = { 'Адрес': c.clientAddress || '' };
    const mats = [...new Set(ps.map(p => (p.fields || {})['Материал']).filter(Boolean))]; if (mats.length) fields['Материал'] = mats.join(' / ');
    const cols = [...new Set(ps.map(p => (p.fields || {})['Цвет']).filter(Boolean))]; if (cols.length === 1) fields['Цвет'] = cols[0];
    items.forEach((t, i) => { if (i < 7 || items.length <= 8) fields[`Изделие ${i + 1}`] = t; else if (i === 7) fields['Изделие 8'] = `+ ещё ${items.length - 7} поз. — см. PDF`; });
    const note = [
      `Комбинированный заказ №${c.orderNumber || '—'}`,
      `Клиент: ${c.clientName || '—'}${c.clientPhone ? ', ' + c.clientPhone : ''}`, `Адрес: ${c.clientAddress || '—'}`, '',
      ...ps.flatMap(p => { const ls = lineSums(p, sel); return [`${p.name} — ${rub(p.prices[sel])}${p.noInstall ? ' (без монтажа)' : ''}`, ...(p.details || []).map(x => '  ' + x), ...p.items.map((it, i) => `  ${it.n}. ${it.room || '—'}: ${it.text} — ${rub(ls[i])}`), '']; }),
      `Итого для клиента (${priceLabel(sel)}): ${rub(tot)}`,
      `Предоплата: ${pre > 0 ? rub(pre) : 'без предоплаты'}`, `К доплате после установки: ${rub(Math.max(0, tot - pre))}`,
      ...(c.orderNote ? ['', 'Доп. информация:', c.orderNote] : []), '', 'КП, заказ-наряд с раскроем и наклейки — в файлах сделки.'
    ].join('\n');
    setStatus('⏳ Отправляю сделку…');
    const lead = await call(cfg, '/lead', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({
      lead_id: leadId || undefined, title: [c.orderNumber ? '№ ' + c.orderNumber : '', street(c.clientAddress) || c.clientName].filter(Boolean).join(' ') || 'Комбинированный заказ',
      price: tot, pipeline: st.pipeline || $('pipeline').value, status: 'Изготовление', contact: { name: c.clientName || '', phone: c.clientPhone || '' },
      fields, note, tags: [...new Set(['Комбинированный', ...ps.flatMap(p => (p.tags || []).filter(t => !/^\d+ шт$/.test(t))), `${ps.reduce((a, p) => a + pcs(p), 0)} шт`])] }) });
    try { localStorage.setItem(leadKey, String(lead.lead_id)); if (lead.url) localStorage.setItem('spAmoBase', new URL(lead.url).origin); } catch (e) {}
    const files = [['заказ-наряд', fileName('Заказ-наряд'), orderBlob], ['КП', fileName('КП'), kpBlob], ['наклейки', fileName('Наклейки'), labelsBlob]];
    const done = [], failed = [];
    for (const [label, name, blob] of files) {
      if (!blob) { failed.push(label + ' (не собрались)'); continue; }
      setStatus(`⏳ Прикрепляю: ${label}…`);
      let err = ''; for (let a = 1; a <= 2; a++) { try { await call(cfg, `/file?lead_id=${lead.lead_id}`, { method: 'POST', headers: { 'Content-Type': 'application/pdf', 'X-File-Name': encodeURIComponent(name) }, body: blob }); err = ''; break; } catch (e) { err = e.message; } }
      (err ? failed : done).push(err ? `${label} — ${err}` : label);
    }
    const link = `<a href="${esc(lead.url)}" target="_blank" rel="noopener">открыть сделку</a>`;
    setStatus(`${failed.length ? '⚠' : '✓'} ${lead.created ? `Сделка создана в «${esc(lead.pipeline_name || st.pipeline)}» → «${esc(lead.status_name || 'Изготовление')}»` : 'Сделка обновлена'}: ${rub(tot)}, прикреплены: ${done.join(', ') || '—'}${failed.length ? '. Не прикрепилось: ' + failed.map(esc).join('; ') : ''} — ${link}`, failed.length ? 'warn' : 'ok');
  });

  // старт: подгрузить разделы, чтобы сводка была свежей
  render();
  ordered().forEach(id => frameFor(id));
  if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
</html>
