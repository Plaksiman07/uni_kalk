<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#363b44"/><stop offset="1" stop-color="#1c1f24"/>
    </linearGradient>
    <linearGradient id="sun" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f3c463"/><stop offset="1" stop-color="#e0a33a"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <!-- группа рисунка; масштаб задаёт отступ безопасной зоны -->
  <g id="art" transform="translate(256 256) scale(1.0) translate(-256 -256)">
    <!-- карниз / короб -->
    <rect x="118" y="112" width="276" height="26" rx="6" fill="#f4f5f7"/>
    <!-- ламели: от тёмных к светлым -->
    <rect x="140" y="156" width="232" height="22" rx="4" fill="#9aa1ab"/>
    <rect x="140" y="190" width="232" height="22" rx="4" fill="#adb3bc"/>
    <rect x="140" y="224" width="232" height="22" rx="4" fill="#c0c5cc"/>
    <rect x="140" y="258" width="232" height="22" rx="4" fill="#d3d7dc"/>
    <rect x="140" y="292" width="232" height="22" rx="4" fill="#e6e8eb"/>
    <!-- шнур управления -->
    <line x1="382" y1="138" x2="382" y2="300" stroke="#e0a33a" stroke-width="5" stroke-linecap="round"/>
    <circle cx="382" cy="308" r="9" fill="none" stroke="#e0a33a" stroke-width="5"/>
    <!-- солнце -->
    <path d="M206 332 a50 50 0 0 0 100 0 z" fill="url(#sun)"/>
    <g stroke="#e8b04b" stroke-width="9" stroke-linecap="round">
      <line x1="256" y1="400" x2="256" y2="420"/>
      <line x1="214" y1="388" x2="204" y2="404"/>
      <line x1="298" y1="388" x2="308" y2="404"/>
      <line x1="184" y1="362" x2="166" y2="372"/>
      <line x1="328" y1="362" x2="346" y2="372"/>
    </g>
  </g>
</svg>
